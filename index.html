<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D3A2B">
<meta name="description" content="Beyond the Job Title: a question roulette for better networking conversations.">
<title>Beyond the Job Title</title>
<style>
  :root {
    --forest: #1D3A2B;
    --forest-deep: #14291E;
    --forest-soft: #27503B;
    --cream: #FBF6EA;
    --cream-shade: #EFE5CF;
    --orange: #F07A35;
    --orange-bright: #F58B4C;
    --orange-ink: #B4501C;
    --muted-on-cream: #5F6B60;
    --muted-on-forest: #C9D6CB;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Charter, "Bitstream Charter", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius-lg: 28px;
    --radius-md: 18px;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--sans);
    color: var(--cream);
    background:
      radial-gradient(120% 70% at 50% -10%, var(--forest-soft) 0%, transparent 60%),
      radial-gradient(90% 60% at 100% 110%, rgba(240,122,53,.10) 0%, transparent 55%),
      var(--forest);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top) + 28px)
      calc(env(safe-area-inset-right) + 20px)
      calc(env(safe-area-inset-bottom) + 24px)
      calc(env(safe-area-inset-left) + 20px);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .hero {
    text-align: center;
    padding-top: clamp(16px, 8vh, 72px);
    transition: padding .5s var(--ease-out);
  }
  .title {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2.6rem, 11vw, 3.75rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
    transition: font-size .5s var(--ease-out);
  }
  .title em {
    font-style: italic;
    color: var(--orange);
  }
  .subtitle {
    margin: 16px auto 0;
    max-width: 22em;
    font-size: clamp(1.05rem, 4.2vw, 1.2rem);
    line-height: 1.45;
    color: var(--muted-on-forest);
    transition: opacity .3s ease, max-height .5s var(--ease-out), margin .5s var(--ease-out);
    max-height: 6em;
    overflow: hidden;
  }

  /* ---------- Mode picker ---------- */
  .modes {
    border: 0;
    margin: clamp(28px, 6vh, 48px) 0 0;
    padding: 0;
    min-width: 0;
  }
  .modes legend {
    display: block;
    width: 100%;
    text-align: center;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted-on-forest);
    margin-bottom: 14px;
    padding: 0;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .mode {
    position: relative;
    display: block;
  }
  .mode input {
    position: absolute;
    opacity: 0;
    inset: 0;
    margin: 0;
    cursor: pointer;
  }
  .mode span {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    min-height: 72px;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1.5px solid rgba(251,246,234,.22);
    background: rgba(251,246,234,.04);
    transition: background .2s ease, border-color .2s ease, color .2s ease, transform .15s ease;
    cursor: pointer;
  }
  .mode b {
    font-size: 1rem;
    font-weight: 650;
    line-height: 1.2;
  }
  .mode small {
    font-size: .82rem;
    line-height: 1.3;
    color: var(--muted-on-forest);
    transition: color .2s ease;
  }
  .mode input:hover + span { border-color: rgba(251,246,234,.45); }
  .mode input:active + span { transform: scale(.98); }
  .mode input:checked + span {
    background: var(--cream);
    border-color: var(--cream);
    color: var(--forest-deep);
  }
  .mode input:checked + span small { color: var(--muted-on-cream); }
  .mode input:checked + span b::after {
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    margin-left: 7px;
    vertical-align: middle;
    border-radius: 50%;
    background: var(--orange);
    transform: translateY(-1px);
  }
  .mode input:focus-visible + span {
    outline: 3px solid var(--orange);
    outline-offset: 3px;
  }

  /* ---------- Stage / card ---------- */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 28px 0 8px;
  }
  .deck {
    position: relative;
    display: none;
  }
  .deck::before,
  .deck::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius-lg);
    background: var(--cream-shade);
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    transition: transform .4s var(--ease-out);
  }
  .deck::before { transform: rotate(-3.5deg) translateY(8px); opacity: .55; }
  .deck::after  { transform: rotate(2.5deg) translateY(4px); opacity: .8; }

  .card {
    position: relative;
    z-index: 1;
    min-height: clamp(260px, 40vh, 360px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(28px, 7vw, 44px) clamp(24px, 6.5vw, 40px);
    border-radius: var(--radius-lg);
    background: var(--cream);
    color: var(--forest-deep);
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 22px 50px -12px rgba(0,0,0,.45),
      0 6px 16px rgba(0,0,0,.12);
    outline: none;
  }
  .card:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 4px;
  }
  .category {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 18px;
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--orange-ink);
  }
  .category::before {
    content: "";
    width: 22px;
    height: 2px;
    border-radius: 2px;
    background: var(--orange);
    flex: none;
  }
  .question {
    margin: 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.55rem, 6.4vw, 2.15rem);
    line-height: 1.24;
    letter-spacing: -0.01em;
    text-wrap: pretty;
  }

  /* Shuffle animation */
  .is-shuffling .card { animation: jiggle .5s ease-in-out infinite; }
  .is-shuffling .deck::before { transform: rotate(-9deg) translate(-14px, 10px); }
  .is-shuffling .deck::after  { transform: rotate(8deg) translate(14px, 6px); }
  .is-shuffling .category,
  .is-shuffling .question {
    filter: blur(2.5px);
    opacity: .4;
  }
  .category, .question { transition: filter .25s ease, opacity .25s ease; }
  .reveal .card { animation: pop .55s var(--ease-spring); }
  .reveal .question,
  .reveal .category { animation: rise .5s var(--ease-out) both; }
  .reveal .question { animation-delay: .06s; }

  @keyframes jiggle {
    0%, 100% { transform: rotate(0) translateY(0); }
    25% { transform: rotate(-1.6deg) translateY(-3px); }
    75% { transform: rotate(1.6deg) translateY(-3px); }
  }
  @keyframes pop {
    0% { transform: scale(.94) rotate(-1deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .note {
    min-height: 1.4em;
    margin: 18px 0 0;
    text-align: center;
    font-size: .9rem;
    color: var(--muted-on-forest);
  }

  /* ---------- Actions ---------- */
  .actions {
    display: grid;
    gap: 12px;
    padding-top: 8px;
  }
  .secondary-actions {
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  button {
    font: inherit;
    border: 0;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  button:focus-visible {
    outline: 3px solid var(--cream);
    outline-offset: 3px;
  }
  .btn-primary {
    width: 100%;
    min-height: 64px;
    padding: 18px 24px;
    border-radius: 999px;
    background: var(--orange);
    color: var(--forest-deep);
    font-size: 1.18rem;
    font-weight: 750;
    letter-spacing: .01em;
    box-shadow: 0 10px 24px -8px rgba(240,122,53,.65), 0 2px 0 rgba(255,255,255,.25) inset;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-primary:hover { background: var(--orange-bright); }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary svg { width: 22px; height: 22px; flex: none; }
  .is-shuffling .btn-primary svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-secondary {
    min-height: 54px;
    padding: 14px 16px;
    border-radius: 999px;
    background: transparent;
    color: var(--cream);
    border: 1.5px solid rgba(251,246,234,.35);
    font-size: 1rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .btn-secondary:hover { background: rgba(251,246,234,.08); border-color: rgba(251,246,234,.6); }
  .btn-secondary:active { transform: scale(.97); }
  .btn-secondary svg { width: 18px; height: 18px; flex: none; }
  .btn-secondary span { white-space: nowrap; }
  .btn-secondary.is-done { border-color: var(--orange); color: var(--orange); }

  button[disabled] { cursor: progress; }

  /* ---------- Playing state ---------- */
  .is-playing .hero { padding-top: 0; }
  .is-playing .title { font-size: clamp(1.5rem, 6vw, 1.85rem); }
  .is-playing .subtitle { opacity: 0; max-height: 0; margin-top: 0; }
  .is-playing .modes { margin-top: 18px; }
  .is-playing .modes legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .is-playing .mode-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .is-playing .mode { flex: none; }
  .is-playing .mode span {
    min-height: 44px;
    padding: 9px 15px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .is-playing .mode b { font-size: .92rem; }
  .is-playing .mode small { display: none; }
  .is-playing .deck { display: block; }
  .is-playing .secondary-actions { display: grid; }
  .welcome-spacer { flex: 1; }
  .is-playing .welcome-spacer { display: none; }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  @media (min-width: 640px) {
    .app { padding-top: calc(env(safe-area-inset-top) + 48px); }
  }
  @media (max-width: 420px) {
    .btn-secondary { padding: 14px 10px; font-size: .97rem; }
    .btn-secondary svg { display: none; }
  }
  @media (max-width: 350px) {
    .mode-grid { grid-template-columns: 1fr; }
    .secondary-actions { grid-template-columns: 1fr; }
  }
  @media (max-width: 380px) {
    .is-playing .mode-grid { gap: 6px; }
    .is-playing .mode span { min-height: 40px; padding: 8px 12px; }
    .is-playing .mode b { font-size: .84rem; }
  }
  @media (max-height: 720px) {
    .app { padding-top: calc(env(safe-area-inset-top) + 16px); }
    .is-playing .modes { margin-top: 12px; }
    .stage { padding: 16px 0 4px; }
    .card { min-height: 220px; padding: 26px 24px; }
    .note { margin-top: 10px; }
    .btn-primary { min-height: 58px; padding: 14px 22px; }
    .btn-secondary { min-height: 50px; padding-top: 12px; padding-bottom: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    .is-shuffling .category,
    .is-shuffling .question { filter: none; opacity: 1; }
  }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="hero">
    <h1 class="title">Beyond the <em>Job Title</em></h1>
    <p class="subtitle">Great connections start with better questions.</p>
  </header>

  <fieldset class="modes">
    <legend>Choose your conversation</legend>
    <div class="mode-grid" id="modeGrid">
      <label class="mode">
        <input type="radio" name="mode" value="surprise" checked>
        <span><b>Surprise Me</b><small>Any question</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="light">
        <span><b>Light &amp; Fun</b><small>Easy openers</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="personal">
        <span><b>Personal Stories</b><small>Journeys &amp; people</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="deep">
        <span><b>Deep Conversations</b><small>Values &amp; lessons</small></span>
      </label>
    </div>
  </fieldset>

  <section class="stage" aria-label="Question">
    <div class="deck" id="deck">
      <article class="card" id="card" tabindex="-1" aria-live="polite" aria-atomic="true">
        <p class="category" id="category"></p>
        <h2 class="question" id="question"></h2>
      </article>
    </div>
    <p class="note" id="note" role="status"></p>
  </section>

  <div class="welcome-spacer" aria-hidden="true"></div>

  <div class="actions">
    <button type="button" class="btn-primary" id="spinBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span id="spinLabel">Spin the Question</span>
    </button>
    <div class="secondary-actions">
      <button type="button" class="btn-secondary" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>
        <span id="copyLabel">Copy Question</span>
      </button>
      <button type="button" class="btn-secondary" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
        <span>Start Over</span>
      </button>
    </div>
  </div>
</main>

<script>
/* =====================================================================
   QUESTION BANK — edit freely.
   Each category has a name (shown on the card), a mode, and its questions.
   Modes: "light" = Light & Fun, "personal" = Personal Stories,
          "deep" = Deep Conversations. "Surprise Me" uses every question.
   ===================================================================== */
const CATEGORIES = [
  {
    name: "Past & personal journeys",
    mode: "personal",
    questions: [
      "What's a dream you had when you were younger that still influences you today?",
      "Who believed in your potential before you believed in it yourself?",
      "What is something you initially thought you'd be terrible at, but eventually grew to love?",
      "What was the most unexpected detour in your career, and where did it lead you?",
      "What's a lesson from your first job that still influences how you work today?",
      "Have you ever felt lost? What did you do to find or create your way back?",
    ]
  },
  {
    name: "Present & finding joy",
    mode: "light",
    questions: [
      "What's a part of your job you secretly wish more people could experience?",
      "What is something you find unusually satisfying about your work?",
      "What's a problem you genuinely enjoy solving that other people might find frustrating?",
      "If I shadowed you for a day, which moment would you be most excited to show me?",
      "What do you need to hear and from whom to make your work day 100x better?",
    ]
  },
  {
    name: "Future & aspirations",
    mode: "deep",
    questions: [
      "What is something you still want to learn, even though you're already experienced in your field?",
      "If you could create a completely new role for yourself, what would it involve?",
      "What's one professional adventure you haven't had yet but would love to experience?",
      "Can you explain what ‘inspiration’ is to a 7 year old? What inspires you lately?",
    ]
  },
  {
    name: "Values & perspectives",
    mode: "deep",
    questions: [
      "What's a belief about success that has changed as you've grown older?",
      "What is something you value at work now that you barely considered when you started?",
      "What does emotional maturity mean to you?",
      "What's an unpopular opinion about career success that you stand by?",
      "If someone would like to get to know you through a book, which book would you recommend to them?",
    ]
  },
  {
    name: "Lessons & turning points",
    mode: "deep",
    questions: [
      "What's a mistake that taught you something no success ever could?",
      "What's something you once saw as a weakness that has become a strength?",
      "What is something you wish you had been less afraid of early in your career?",
      "What's a lesson you've learned that you find difficult to explain to someone who hasn't experienced it?",
    ]
  },
  {
    name: "Fond memories & company culture",
    mode: "light",
    questions: [
      "What's a team achievement that still makes you smile?",
      "What's a workplace tradition that says a lot about the people you work with?",
      "How can someone prove to you that you can trust them?",
    ]
  },
  {
    name: "People, mentors & belonging",
    mode: "personal",
    questions: [
      "Who has quietly made the biggest difference in your professional life?",
      "What’s one kind thing a colleague has ever done for you?",
      "What's something a great manager did that you now try to do for others?",
      "When have you felt most like you truly belonged on a team?",
      "Who at work deserves more recognition than they usually receive, and why?",
      "What’s a piece of home you’ll take with you wherever you are?",
      "What’s your go to ‘pep-talk’ for yourself?",
    ]
  },
  {
    name: "Playful & unexpected",
    mode: "light",
    questions: [
      "How would you like to use free will to make life more interesting this week?",
      "What would your colleagues say is your unofficial job title?",
      "If you could borrow anyone's job for a week, whose would you choose?",
      "What's a surprisingly useless skill that has actually helped you at work?",
      "If your workplace had an award for something completely ridiculous, what would you win?",
      "Do you have any sidequests at the moment?",
      "What did you learn from your hobby that you apply at work?",
      "What makes someone stand out at a networking event?",
      "If you were a beverage, would you be a coffee, wine, milk or soda?",
      "If you were to be photographed at any moment at work, what do you want the picture to capture?",
      "A book you would recommend to anyone",
    ]
  },
];

(function () {
  "use strict";

  // Flatten the bank into one list with stable ids.
  var ALL = [];
  CATEGORIES.forEach(function (cat) {
    cat.questions.forEach(function (text) {
      ALL.push({ id: ALL.length, text: text, category: cat.name, mode: cat.mode });
    });
  });

  var SHUFFLE_MS = 1000;
  var TICK_MS = 85;

  var app = document.getElementById("app");
  var card = document.getElementById("card");
  var categoryEl = document.getElementById("category");
  var questionEl = document.getElementById("question");
  var noteEl = document.getElementById("note");
  var spinBtn = document.getElementById("spinBtn");
  var spinLabel = document.getElementById("spinLabel");
  var copyBtn = document.getElementById("copyBtn");
  var copyLabel = document.getElementById("copyLabel");
  var resetBtn = document.getElementById("resetBtn");

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
  var seen = new Set();      // ids shown this session (shared across modes)
  var current = null;        // the question on the card
  var busy = false;
  var copyTimer = null;

  function currentMode() {
    var checked = document.querySelector('input[name="mode"]:checked');
    return checked ? checked.value : "surprise";
  }

  function eligible(mode) {
    return mode === "surprise" ? ALL : ALL.filter(function (q) { return q.mode === mode; });
  }

  function randomItem(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  // Pick a question not yet seen; once a mode is exhausted, start a fresh round
  // (never repeating the question that is currently on screen).
  function drawQuestion() {
    var mode = currentMode();
    var pool = eligible(mode);
    var fresh = pool.filter(function (q) { return !seen.has(q.id); });
    var newRound = false;

    if (fresh.length === 0) {
      pool.forEach(function (q) { seen.delete(q.id); });
      fresh = pool.filter(function (q) { return !current || q.id !== current.id || pool.length === 1; });
      newRound = true;
    }
    var pick = randomItem(fresh);
    seen.add(pick.id);
    return { question: pick, newRound: newRound, pool: pool };
  }

  function setBusy(state) {
    busy = state;
    spinBtn.disabled = state;
    copyBtn.disabled = state;
    resetBtn.disabled = state;
    card.setAttribute("aria-busy", state ? "true" : "false");
  }

  function show(q) {
    categoryEl.textContent = q.category;
    questionEl.textContent = q.text;
  }

  function spin() {
    if (busy) return;
    var firstSpin = !app.classList.contains("is-playing");
    var result = drawQuestion();
    current = result.question;
    noteEl.textContent = "";
    resetCopyLabel();

    app.classList.add("is-playing");
    app.classList.remove("reveal");
    spinLabel.textContent = "Another Question";

    if (reduceMotion && reduceMotion.matches) {
      show(current);
      finish(result.newRound, firstSpin);
      return;
    }

    setBusy(true);
    // Mute live announcements during the shuffle so screen readers only hear the result.
    card.setAttribute("aria-live", "off");
    app.classList.add("is-shuffling");

    var started = performance.now();
    var lastTick = 0;
    function tick(now) {
      if (now - started >= SHUFFLE_MS) {
        app.classList.remove("is-shuffling");
        card.setAttribute("aria-live", "polite");
        show(current);
        void card.offsetWidth; // restart the reveal animation
        app.classList.add("reveal");
        setBusy(false);
        finish(result.newRound, firstSpin);
        return;
      }
      if (now - lastTick >= TICK_MS) {
        lastTick = now;
        show(randomItem(result.pool));
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function finish(newRound, firstSpin) {
    if (newRound) {
      noteEl.textContent = "You've seen every question here, so a fresh round has started.";
    }
    if (firstSpin) spinBtn.focus({ preventScroll: true });
  }

  function resetCopyLabel() {
    clearTimeout(copyTimer);
    copyLabel.textContent = "Copy Question";
    copyBtn.classList.remove("is-done");
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyQuestion() {
    if (!current || busy) return;
    var text = current.text;
    function done(ok) {
      clearTimeout(copyTimer);
      copyLabel.textContent = ok ? "Copied!" : "Copy failed";
      copyBtn.classList.toggle("is-done", ok);
      noteEl.textContent = ok ? "Question copied to your clipboard." : "Couldn't copy. Try selecting the text instead.";
      copyTimer = setTimeout(function () {
        resetCopyLabel();
        if (noteEl.textContent.indexOf("clipboard") !== -1 || noteEl.textContent.indexOf("copy") !== -1) noteEl.textContent = "";
      }, 2000);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
    } else {
      done(fallbackCopy(text));
    }
  }

  function startOver() {
    if (busy) return;
    seen.clear();
    current = null;
    categoryEl.textContent = "";
    questionEl.textContent = "";
    noteEl.textContent = "";
    resetCopyLabel();
    app.classList.remove("is-playing", "reveal", "is-shuffling");
    spinLabel.textContent = "Spin the Question";
    window.scrollTo(0, 0);
    spinBtn.focus({ preventScroll: true });
  }

  spinBtn.addEventListener("click", spin);
  copyBtn.addEventListener("click", copyQuestion);
  resetBtn.addEventListener("click", startOver);

})();
</script>
</body>
</html>
